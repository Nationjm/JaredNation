<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jared Nation - Resume</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --background: #f8fafc;
      --white: #ffffff;
      --text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom right, #f8fafc, #e2e8f0);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background-color: var(--primary);
      color: var(--white);
      width: 100%;
      padding: 2.5rem 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    nav {
      background-color: var(--white);
      padding: 1rem;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    nav a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      position: relative;
      transition: color 0.3s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0%;
      height: 2px;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }

    nav a:hover {
      color: #1d4ed8;
    }

    nav a:hover::after {
      width: 100%;
    }

    .linkedin-icon {
      width: 20px;
      height: 20px;
      fill: var(--primary);
      transition: fill 0.3s;
    }

    .linkedin-icon:hover {
      fill: #1d4ed8;
    }

    .container {
      max-width: 900px;
      width: 90%;
      margin: 3rem auto;
      background-color: var(--white);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    h2 {
      margin-bottom: 1.5rem;
    }

    iframe {
      width: 100%;
      height: calc(100vh + 265px); /* Adjusted for header, nav, and padding */
      border: none;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    @media (max-width: 768px) {
      iframe {
        height: calc(100vh - 280px); /* Slightly smaller on mobile */
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Jared Nation</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="resume.html">Resume</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="https://www.linkedin.com/in/jared-nation-cs" target="_blank" aria-label="LinkedIn">
      <svg class="linkedin-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8h4V24h-4V8zM8.5 8h3.6v2.16h.05c.5-.96 1.75-1.96 3.6-1.96 3.85 0 4.56 2.54 4.56 5.85V24h-4v-7.52c0-1.8-.04-4.12-2.51-4.12-2.51 0-2.9 1.96-2.9 3.99V24h-4V8z"/>
      </svg>
    </a>
  </nav>

  <div class="container">
    <h2>My Resume</h2>
    <iframe src="NationJaredResume.pdf" title="Resume PDF"></iframe>
  </div>
</body>
</html>
